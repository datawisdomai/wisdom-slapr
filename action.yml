name: 'Hack-A-Dog Slapr'
description: 'Add emoji on Slack posts on PR updates'
inputs:
  github-token:
    description: 'GitHub API token'
    required: true
  slack-api-token:
    description: 'Slack bot OAuth token'
    required: true
  slack-channel-id:
    description: 'Slack channel ID(s) for emoji reactions. Comma-separated for multiple channels.'
    required: true
  bot-user-id:
    description: 'Slack user ID of the slapr bot'
    required: true
  review-map:
    description: 'Path to a YAML file mapping GitHub teams to Slack channels'
    required: false
  number-of-approvals-required:
    description: 'Minimum approvals for "approved" emoji'
    required: false
    default: '1'
  emoji-review-started:
    description: 'Emoji name for review started. Leave unset or empty to disable.'
    required: false
  emoji-approved:
    description: 'Emoji name for approved. Leave unset or empty to disable.'
    required: false
  emoji-changes-requested:
    description: 'Emoji name for changes requested. Leave unset or empty to disable.'
    required: false
  emoji-merged:
    description: 'Emoji name for merged. Leave unset or empty to disable.'
    required: false
  emoji-closed:
    description: 'Emoji name for closed. Leave unset or empty to disable.'
    required: false
  emoji-commented:
    description: 'Emoji name for comment-only review. Leave unset or empty to disable.'
    required: false
  emoji-pr-open:
    description: 'Emoji name for open PR state. Leave unset or empty to disable.'
    required: false
  emoji-pr-draft:
    description: 'Emoji name for draft PR state. Leave unset or empty to disable.'
    required: false
  emoji-pr-queue:
    description: 'Emoji name for queued PR state. Leave unset or empty to disable.'
    required: false
  emoji-pr-merged:
    description: 'Emoji name for merged PR state. Defaults to emoji-merged when unset.'
    required: false
  emoji-pr-closed:
    description: 'Emoji name for closed PR state. Defaults to emoji-closed when unset.'
    required: false
  emoji-ci-running:
    description: 'Emoji name for running CI status. Leave unset or empty to disable CI status.'
    required: false
  emoji-ci-failing:
    description: 'Emoji name for failing CI status. Leave unset or empty to disable CI status.'
    required: false
  emoji-ci-passing:
    description: 'Emoji name for passing CI status. Leave unset or empty to disable CI status.'
    required: false
  ignore-ci-check-names:
    description: 'Comma-separated check run names to ignore when computing CI status.'
    required: false
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    GITHUB_TOKEN: ${{ inputs.github-token }}
    SLACK_API_TOKEN: ${{ inputs.slack-api-token }}
    SLACK_CHANNEL_ID: ${{ inputs.slack-channel-id }}
    SLAPR_BOT_USER_ID: ${{ inputs.bot-user-id }}
    SLAPR_REVIEW_MAP: ${{ inputs.review-map }}
    SLAPR_NUMBER_OF_APPROVALS_REQUIRED: ${{ inputs.number-of-approvals-required }}
    SLAPR_EMOJI_REVIEW_STARTED: ${{ inputs.emoji-review-started }}
    SLAPR_EMOJI_APPROVED: ${{ inputs.emoji-approved }}
    SLAPR_EMOJI_CHANGES_REQUESTED: ${{ inputs.emoji-changes-requested }}
    SLAPR_EMOJI_MERGED: ${{ inputs.emoji-merged }}
    SLAPR_EMOJI_CLOSED: ${{ inputs.emoji-closed }}
    SLAPR_EMOJI_COMMENTED: ${{ inputs.emoji-commented }}
    SLAPR_EMOJI_PR_OPEN: ${{ inputs.emoji-pr-open }}
    SLAPR_EMOJI_PR_DRAFT: ${{ inputs.emoji-pr-draft }}
    SLAPR_EMOJI_PR_QUEUE: ${{ inputs.emoji-pr-queue }}
    SLAPR_EMOJI_PR_MERGED: ${{ inputs.emoji-pr-merged }}
    SLAPR_EMOJI_PR_CLOSED: ${{ inputs.emoji-pr-closed }}
    SLAPR_EMOJI_CI_RUNNING: ${{ inputs.emoji-ci-running }}
    SLAPR_EMOJI_CI_FAILING: ${{ inputs.emoji-ci-failing }}
    SLAPR_EMOJI_CI_PASSING: ${{ inputs.emoji-ci-passing }}
    SLAPR_IGNORE_CI_CHECK_NAMES: ${{ inputs.ignore-ci-check-names }}
