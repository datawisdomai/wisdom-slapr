name: Slapr smoke test

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: "Pull request number to update"
        required: false
        default: "1"
      slack-channel-id:
        description: "Slack channel ID for the test channel"
        required: false
        default: "C0952EA3Z1U"
      emoji-open:
        description: "Open PR emoji name"
        required: false
        default: "open"
      emoji-draft:
        description: "Draft PR emoji name"
        required: false
        default: "draft"
      emoji-queue:
        description: "Queued PR emoji name"
        required: false
        default: "queue"
      emoji-merged:
        description: "Merged PR emoji name"
        required: false
        default: "merged"
      emoji-closed:
        description: "Closed PR emoji name"
        required: false
        default: "closed"
      emoji-ci-running:
        description: "Running CI emoji name"
        required: false
        default: "running"
      emoji-ci-failing:
        description: "Failing CI emoji name"
        required: false
        default: "failing"
      emoji-ci-passing:
        description: "Passing CI emoji name"
        required: false
        default: "passing"
      ignore-ci-check-names:
        description: "Comma-separated check names to ignore"
        required: false
        default: "run_slapr"
  push:
    branches:
      - praskr/slapr-pr-ci-status-emojis
    paths:
      - ".github/workflows/slapr-smoke-test.yml"
      - "action.yml"
      - "Dockerfile"
      - "slapr/**"

permissions:
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  run_slapr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Write workflow_run event payload
        env:
          PR_NUMBER: ${{ inputs['pr-number'] || '1' }}
        run: |
          jq -n --argjson pr_number "$PR_NUMBER" \
            '{action: "completed", workflow_run: {pull_requests: [{number: $pr_number}]}}' \
            > "$GITHUB_WORKSPACE/.slapr-smoke-event.json"
          cat "$GITHUB_WORKSPACE/.slapr-smoke-event.json"

      - name: Install Slapr
        run: python -m pip install .

      - name: Run Slapr against test channel
        env:
          GITHUB_EVENT_PATH: ${{ github.workspace }}/.slapr-smoke-event.json
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SLACK_API_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs['slack-channel-id'] || 'C0952EA3Z1U' }}
          SLAPR_BOT_USER_ID: UTMS06TPX
          SLAPR_EMOJI_OPEN: ${{ inputs['emoji-open'] || 'open' }}
          SLAPR_EMOJI_DRAFT: ${{ inputs['emoji-draft'] || 'draft' }}
          SLAPR_EMOJI_QUEUE: ${{ inputs['emoji-queue'] || 'queue' }}
          SLAPR_EMOJI_MERGED: ${{ inputs['emoji-merged'] || 'merged' }}
          SLAPR_EMOJI_CLOSED: ${{ inputs['emoji-closed'] || 'closed' }}
          SLAPR_EMOJI_CI_RUNNING: ${{ inputs['emoji-ci-running'] || 'running' }}
          SLAPR_EMOJI_CI_FAILING: ${{ inputs['emoji-ci-failing'] || 'failing' }}
          SLAPR_EMOJI_CI_PASSING: ${{ inputs['emoji-ci-passing'] || 'passing' }}
          SLAPR_IGNORE_CI_CHECK_NAMES: ${{ inputs['ignore-ci-check-names'] || 'run_slapr' }}
        run: python -m slapr
